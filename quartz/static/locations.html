  .count{color:var(--accent2)}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;
         padding:8px 14px;font:inherit;cursor:pointer}
  button:hover{background:var(--accent2)}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);
        font-size:.92rem;vertical-align:top}
  th{background:#0e1116;color:var(--bright);cursor:pointer;user-select:none;
     position:sticky;top:0;white-space:nowrap}
  th .arr{color:var(--accent2);font-size:.8em}
  tr:hover td{background:rgba(94,131,196,.08)}
  td.t a{color:var(--accent2);text-decoration:none}
  td.t a:hover{text-decoration:underline}
  .blank{color:#5b6472;font-style:italic}

</style>

lding type": "Warehouse", "lifestyle": ""}, {"title": "Warehouse of the Salters", "slug": "warehouse-of-the-salters", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Warehouse", "lifestyle": ""}, {"title": "Warm Beds", "slug": "warm-beds", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Inn", "lifestyle": ""}, {"title": "Warriors of Waterdeep", "slug": "warriors-of-waterdeep", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Monument", "lifestyle": ""}, {"title": "Waterman's Hall", "slug": "watermans-hall", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Guild HQ: Watermen", "lifestyle": ""}, {"title": "Wavesilver Villa", "slug": "wavesilver-villa", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Noble family villa", "lifestyle": ""}, {"title": "Wheel Hall", "slug": "wheel-hall", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Guild HQ: Wheelwrights", "lifestyle": ""}, {"title": "Zorth Ulmaril", "slug": "zorth-ulmaril", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Lanternmaker's Shop", "lifestyle": ""}, {"title": "Zulpair Villa", "slug": "zulpair-villa", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Noble family villa", "lifestyle": ""}, {"title": "Zun Villa", "slug": "zun-villa", "ward": "", "district": "", "neighborhood": "", "street": "", "building type": "Noble family villa", "lifestyle": ""}];
const FIELDS = ["ward", "district", "neighborhood", "street", "building type", "lifestyle"];
const LINK_PREFIX = "../_locations/";
const LABELS = {title:"Title", ward:"Ward", district:"District",
  neighborhood:"Neighborhood", street:"Street", "building type":"Building Type",
  lifestyle:"Lifestyle"};
const COLS = ["title", ...FIELDS];

let sortKey = "title", sortDir = 1;
const filterEls = {};

function distinct(field){
  return [...new Set(DATA.map(r => r[field]).filter(v => v !== ""))]
    .sort((a,b)=>a.localeCompare(b));
}

// build filter dropdowns
const fdiv = document.getElementById("filters");
FIELDS.forEach(f=>{
  const wrap=document.createElement("div"); wrap.className="f";
  const lab=document.createElement("label"); lab.textContent=LABELS[f]; wrap.appendChild(lab);
  const sel=document.createElement("select");
  sel.innerHTML = '<option value="__any">(any)</option>'
                + '<option value="__blank">(blank)</option>'
                + distinct(f).map(v=>`<option value="${v.replace(/"/g,'&quot;')}">${v}</option>`).join("");
  sel.addEventListener("change", render);
  filterEls[f]=sel; wrap.appendChild(sel); fdiv.appendChild(wrap);
});

// build header
const head=document.getElementById("head");
COLS.forEach(c=>{
  const th=document.createElement("th"); th.dataset.key=c;
  th.innerHTML = LABELS[c] + ' <span class="arr"></span>';
  th.addEventListener("click",()=>{ if(sortKey===c) sortDir*=-1; else {sortKey=c; sortDir=1;} render(); });
  head.appendChild(th);
});

document.getElementById("q").addEventListener("input", render);
document.getElementById("reset").addEventListener("click", ()=>{
  FIELDS.forEach(f=>filterEls[f].value="__any");
  document.getElementById("q").value=""; render();
});

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let rows = DATA.filter(r=>{
    for(const f of FIELDS){
      const v = filterEls[f].value;
      if(v==="__any") continue;
      if(v==="__blank"){ if(r[f]!=="") return false; }
      else if(r[f]!==v) return false;
    }
    if(q && !r.title.toLowerCase().includes(q)) return false;
    return true;
  });
  rows.sort((a,b)=>{
    const x=(a[sortKey]||"").toLowerCase(), y=(b[sortKey]||"").toLowerCase();
    return x<y? -sortDir : x>y? sortDir : 0;
  });
  const body=document.getElementById("body");
  body.innerHTML = rows.map(r=>{
    const cells = COLS.map(c=>{
      if(c==="title"){
        const href = LINK_PREFIX + r.slug + "/";
        return `<td class="t"><a href="${href}">${esc(r.title)}</a></td>`;
      }
      return r[c]==="" ? '<td><span class="blank">—</span></td>' : `<td>${esc(r[c])}</td>`;
    }).join("");
    return "<tr>"+cells+"</tr>";
  }).join("");
  document.getElementById("count").textContent = rows.length + " of " + DATA.length + " shown";
  // header arrows
  document.querySelectorAll("#head th").forEach(th=>{
    th.querySelector(".arr").textContent = th.dataset.key===sortKey ? (sortDir>0?"▲":"▼") : "";
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
render();
</script>
